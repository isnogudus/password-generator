[package]
edition = "2024"
name = "password-generator"
version = "0.1.0"

[dependencies]
rand = "0.8"
serde = {version = "1.0", features = ["derive"]}

# Hash-Verfahren (Feature "hash"); im Browser entbehrlich
argon2 = {version = "0.6.0", optional = true}
bcrypt = {version = "0.19.3", optional = true}
sha-crypt = {version = "0.6.0", features = ["getrandom"], optional = true}

# Nur für CLI und Webserver (Feature "bin"); als Bibliothek entbehrlich
axum = {version = "0.7", optional = true}
clap = {version = "4.5", features = ["derive"], optional = true}
nix = {version = "0.31.3", features = ["user", "fs"], optional = true}
serde_json = {version = "1.0.151", optional = true}
tokio = {version = "1", features = ["full"], optional = true}

[features]
default = ["bin"]
# Hash-Verfahren argon2id, bcrypt, sha512-crypt (Modul `hash`)
hash = ["dep:argon2", "dep:bcrypt", "dep:sha-crypt"]
# CLI und Webserver; `default-features = false` für die reine Bibliothek
bin = ["hash", "dep:axum", "dep:clap", "dep:nix", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
serde_json = "1.0.151"

[[bin]]
name = "password-generator"
path = "src/main.rs"
required-features = ["bin"]

[profile.release]
codegen-units = 1 # Better optimization
lto = true # Link-Time Optimization
opt-level = "z" # Optimize for size
strip = true # Remove debug symbols
