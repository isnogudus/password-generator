# password-generator behind nginx -- example server block.
#
# The generator listens on 127.0.0.1:3000 (its default); nginx terminates TLS
# and proxies to it. TLS matters: browsers only expose the clipboard API on
# HTTPS (or localhost), so the "Copy" buttons of the web UI need it.
#
# Drop this into /etc/nginx/conf.d/ (Linux) or include it from
# /etc/nginx/nginx.conf (OpenBSD, see docs/OPENBSD.md), adjust the host name
# and certificate paths, then reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name pw.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pw.example.org;

    ssl_certificate     /etc/ssl/pw.example.org.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/pw.example.org.key;

    # Optional: restrict access. nginx checks the file with crypt(3), so a
    # bcrypt hash from the generator itself works on OpenBSD and on Linux
    # with libxcrypt:
    #   printf 'admin:%s\n' "$(password-generator --hash=bcrypt | cut -f2)" > /etc/nginx/htpasswd
    #auth_basic           "password-generator";
    #auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The Accept header decides between the web UI and plain text;
        # nginx forwards it unchanged by default, so nothing to do here.

        # Hashing (?hash) is deliberately slow, allow it a moment.
        proxy_read_timeout 30s;
    }
}
