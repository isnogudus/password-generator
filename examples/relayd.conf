# password-generator behind OpenBSD httpd(8) + relayd(8) -- relayd part.
#
# relayd terminates TLS on port 443 and forwards to the generator on
# 127.0.0.1:3000. "tls keypair NAME" expects /etc/ssl/NAME.crt and
# /etc/ssl/private/NAME.key, so let acme-client write the full chain to
# /etc/ssl/pw.example.org.crt.
#
# Install as /etc/relayd.conf, adjust the host name, then:
#   doas relayd -n && doas rcctl enable relayd && doas rcctl start relayd

table <pwgen> { 127.0.0.1 }

http protocol "https" {
    tls keypair "pw.example.org"

    # Usual proxy headers; the generator ignores them, but logs elsewhere
    # may want them.
    match request header set "X-Forwarded-For"   value "$REMOTE_ADDR"
    match request header set "X-Forwarded-Proto" value "https"
    match response header set "Strict-Transport-Security" value "max-age=31536000"

    # The Accept header decides between the web UI and plain text; relayd
    # passes request headers through unchanged.

    tcp { nodelay, sack, backlog 128 }
}

relay "https" {
    listen on egress port 443 tls
    protocol "https"
    # "/" answers 200 with a fresh password, cheap enough as a health check.
    forward to <pwgen> port 3000 check http "/" code 200
}
