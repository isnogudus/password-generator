# password-generator behind OpenBSD httpd(8) + relayd(8) -- httpd part.
#
# httpd only handles plain HTTP on port 80: it answers the ACME challenge
# for acme-client(1) and redirects everything else to HTTPS. TLS and the
# reverse proxy to the generator live in relayd.conf.
#
# Install as /etc/httpd.conf, adjust the host name, then:
#   doas httpd -n && doas rcctl enable httpd && doas rcctl start httpd

server "pw.example.org" {
    listen on * port 80

    location "/.well-known/acme-challenge/*" {
        root "/acme"
        request strip 2
    }

    location "*" {
        block return 302 "https://$HTTP_HOST$REQUEST_URI"
    }
}
